<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.5" stop-color="#06122b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e40af" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- orbs -->
    <circle cx="170" cy="60" r="190" fill="url(#glow)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="230" r="210" fill="url(#glow)">
      <animate attributeName="cy" values="230;170;230" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- scan line -->
    <rect x="0" y="-80" width="1000" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;280" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#7dd3fc">
      <circle cx="80" cy="240" r="2"><animate attributeName="cy" values="270;10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="260" r="1.5"><animate attributeName="cy" values="280;0" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="250" r="2"><animate attributeName="cy" values="280;0" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="260" r="1.5"><animate attributeName="cy" values="280;0" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="250" r="2"><animate attributeName="cy" values="280;0" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- HUD corners -->
    <g stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M24 56V24H56"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></path>
      <path d="M944 24H976V56"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></path>
      <path d="M24 224V256H56"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></path>
      <path d="M944 256H976V224"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></path>
    </g>

    <!-- status -->
    <g font-family="'Courier New', monospace" font-size="13" fill="#38bdf8">
      <circle cx="80" cy="50" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="94" y="55" letter-spacing="2">SYSTEM ONLINE // WELCOME</text>
    </g>

    <!-- name -->
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <text x="500" y="145" font-size="50" font-weight="800" fill="#2563eb" filter="url(#blur)" opacity="0.8" letter-spacing="4">BRUNO BELINO FERREIRA</text>
      <text x="500" y="145" font-size="50" font-weight="800" fill="url(#txt)" letter-spacing="4">BRUNO BELINO FERREIRA
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
    </g>

    <!-- rotating roles -->
    <g font-family="'Courier New', monospace" font-size="22" fill="#bae6fd" text-anchor="middle" letter-spacing="2">
      <text x="500" y="200" opacity="0">&gt; Software Engineer_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.2;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
      <text x="500" y="200" opacity="0">&gt; Java | Spring Boot | REST APIs_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.2;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
      <text x="500" y="200" opacity="0">&gt; Python | Apache Airflow | SQL_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.2;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
      <text x="500" y="200" opacity="0">&gt; Docker | Linux | Infraestrutura_
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.2;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
    </g>

    <!-- bottom pulse line -->
    <path d="M0 262H380L400 250L420 274L440 262H1000" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="200 1000" stroke-opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="1200;-200" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="#1d4ed8" stroke-opacity="0.7"/>
</svg>
