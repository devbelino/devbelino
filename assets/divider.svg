<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#l)" opacity="0.5"/>
  <rect x="0" y="10" width="140" height="4" rx="2" fill="#7dd3fc">
    <animate attributeName="x" values="-140;1000" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <g fill="#38bdf8">
    <rect x="492" y="6" width="12" height="12" transform="rotate(45 498 12)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
